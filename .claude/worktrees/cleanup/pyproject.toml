[project]
name = "preserve-testing"
version = "0.1.0"
description = "LLM-generated preservation tests for Poracle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph==1.0.6",
  "pydantic>=2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
